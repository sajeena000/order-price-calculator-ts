<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Price Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🧾 Order Price Calculator</h1>
      <p>TypeScript • Fully Typed • Async Logic</p>
    </header>
    
    <div id="order-form-container"></div>
    
    <div id="items-container"></div>
    <section id="controls-section"> 
      <h2>Tax & Discount</h2>
      <div class="control-group">
        <label>Tax Rate (%):</label>
        <input type="number" id="tax-rate" value="8.5" step="0.1" min="0" max="100" />
      </div>

      <div class="control-group">
        <label>Discount Type:</label>
        <select id="discount-type">
          <option value="percentage">Percentage (%)</option>
          <option value="fixed">Fixed Amount ($)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Discount Value:</label>
        <input type="number" id="discount-value" value="0" step="0.01" min="0" />
      </div>

      <button id="calculate-btn" class="calculate-btn">Calculate Total</button>
    </section>

    <div id="price-container"></div>

  </div>
  
  <script type="module" src="./dist/main.js"></script>
  
  <script>
    window.addEventListener('error', function(e) {
      console.error('Error loading script:', e);
      document.body.innerHTML += '<div style="position:fixed;top:10px;left:10px;background:red;color:white;padding:20px;z-index:9999;">Error loading app. Check console (F12) for details.</div>';
    });
  </script>
</body>
</html>
